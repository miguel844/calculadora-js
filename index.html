<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JS</title>
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <div id="calculadora">
        <!-- Fila 1: Resultado -->
        <div id="resultado"></div>
        <!-- Fila 2 -->
        <div class="boton botonOperacion" id="borrar">←</div>
        <div class="boton botonOperacion" id="ce">CE</div>
        <div class="boton botonOperacion" id="c">C</div>
        <div class="boton botonOperacion" id="dividir">/</div>
        <!-- Fila 3 -->
        <div class="boton" id="boton7">7</div>
        <div class="boton" id="boton8">8</div>
        <div class="boton" id="boton9">9</div>
        <div class="boton botonOperacion" id="multiplicar">x</div>
        <!-- Fila 4 -->
        <div class="boton" id="boton4">4</div>
        <div class="boton" id="boton5">5</div>
        <div class="boton" id="boton6">6</div>
        <div class="boton botonOperacion" id="restar">-</div>
        <!-- Fila 5 -->
        <div class="boton" id="boton1">1</div>
        <div class="boton" id="boton2">2</div>
        <div class="boton" id="boton3">3</div>
        <div class="boton botonOperacion" id="sumar">+</div>
        <!-- Fila 6 -->
        <div class="boton" id="masmenos">+/-</div>
        <div class="boton" id="boton0">0</div>
        <div class="boton" id="punto">.</div>
        <div class="boton botonOperacion" id="igual">=</div>
    </div>
</body>

</html>
